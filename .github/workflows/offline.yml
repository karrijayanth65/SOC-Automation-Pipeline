name: Offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Official actions/* v4 tag commit SHAs verified through GitHub's Git refs API.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      # Uses Node built-ins only; no install step or third-party dependency tree.
      - run: npm test
      - run: npm run check:attack
      - run: npm run check:workflow
      - run: npm run check:dashboard
      - run: npm run check:links
