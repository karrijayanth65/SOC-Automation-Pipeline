<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">SOC Automation Pipeline architecture</title>
<desc id="desc">Splunk alerts enter authenticated n8n webhooks, normalize source fields, receive model analysis with bound indicator lookups, pass report validation, create an IRIS alert and case, then notify Slack for high or critical scores. Analysts review recommendations.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347c84"/></marker></defs>
<rect width="1200" height="570" rx="20" fill="#f4f7f8"/>
<rect width="1200" height="125" rx="20" fill="#142a3c"/>
<path d="M0 100H1200V125H0Z" fill="#142a3c"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="42" y="43" fill="#8cd7d4" font-size="14" font-weight="700" letter-spacing="2">SOC AUTOMATION PIPELINE</text>
<text x="42" y="83" fill="#ffffff" font-size="30" font-weight="700">One alert. Structured context. A reviewable handoff.</text>
<g fill="#ffffff" stroke="#c6d4da" stroke-width="1.5">
<rect x="40" y="155" width="340" height="126" rx="12"/><rect x="430" y="155" width="340" height="126" rx="12"/><rect x="820" y="155" width="340" height="126" rx="12"/>
<rect x="40" y="330" width="340" height="126" rx="12"/><rect x="430" y="330" width="340" height="126" rx="12"/><rect x="820" y="330" width="340" height="126" rx="12"/>
</g>
<g fill="#142a3c" font-size="22" font-weight="700">
<text x="62" y="193">01 / Receive</text><text x="452" y="193">02 / Normalize</text><text x="842" y="193">03 / Analyze + enrich</text>
<text x="842" y="368">04 / Validate report</text><text x="452" y="368">05 / Create case</text><text x="62" y="368">06 / Notify analyst</text>
</g>
<g fill="#4b6476" font-size="16">
<text x="62" y="226">Splunk → n8n header-auth webhook</text><text x="62" y="252">Five detection entry points</text>
<text x="452" y="226">Allowlist fields / preserve event time</text><text x="452" y="252">Validate host, SID and indicators</text>
<text x="842" y="226">LLM advisory + optional IOC tools</text><text x="842" y="252">AbuseIPDB / VirusTotal</text>
<text x="842" y="401">Reject malformed JSON or scores</text><text x="842" y="427">Compute severity deterministically</text>
<text x="452" y="401">DFIR-IRIS alert → case</text><text x="452" y="427">Keep original alert with advisory</text>
<text x="62" y="401">High / Critical → Slack</text><text x="62" y="427">Response actions require approval</text>
</g>
<g stroke="#347c84" stroke-width="3" fill="none" marker-end="url(#arrow)">
<path d="M382 218H418"/><path d="M772 218H808"/><path d="M990 284V318"/><path d="M818 393H782"/><path d="M428 393H392"/>
</g>
<rect x="40" y="488" width="1120" height="48" rx="8" fill="#e3eeee"/>
<text x="60" y="518" fill="#235f66" font-size="16">Fail closed on malformed input • Keep credentials in n8n • Never treat model advice as a containment action</text>
</g></svg>
